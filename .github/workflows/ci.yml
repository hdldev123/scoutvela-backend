name: CI

on:
  pull_request:
    branches: [main, staging, "release-*"]
  push:
    branches: [main, staging, "release-*"]
  workflow_dispatch:

# Pull request cancela a execução anterior da mesma branch; push em staging ou main nunca cancela.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Lint (ESLint)
        run: npm run lint
      - name: Formatação (Prettier)
        run: npm run format:check
      - name: Testes (domínio, permissões e banco em PGlite)
        run: npm test
      - name: Build
        run: npm run build
      - name: Contrato OpenAPI em dia
        run: |
          npm run openapi
          git diff --exit-code openapi.yaml || (echo "openapi.yaml desatualizado: rode npm run openapi e versione o arquivo" && exit 1)
      - name: Vulnerabilidades em dependências de produção
        run: npm audit --omit=dev --audit-level=high
