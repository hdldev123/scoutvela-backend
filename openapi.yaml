  /atletas/{id}/indicadores/{indicadorId}/historico:
    get:
      summary: Histórico de lançamentos de um indicador, do mais novo para o mais antigo
      tags:
        - atletas
      description: "Mesma matriz de acesso da ficha: gestor vê todos, treinador só os
        próprios atletas, atleta só a si. Inclui a sugestão do atleta ainda
        pendente (pendente: true, origem resposta_sugerida ou autoavaliacao) e a
        justificativa da nota do treinador. cf_peso_kg (calculado) traz as
        pesagens, com a nota pela regra P3 atual; perf_mundial, perf_continental
        e perf_nacional (calculados) trazem um item por resultado validado do
        nível, com a nota que a colocação daria pela regra PERF_RESULTADOS atual
        (só as últimas `edicoes_max` edições entram na nota do indicador).
        IBVAR: pilar sensível dá 403; nos demais, sem evidência, avaliador,
        anexo, justificativa nem sugestão pendente (a aprovação aparece como
        `avaliacao`). Atleta fora do acesso ou indicador inexistente: 404."
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
