      description: "Gestor, treinador dos próprios atletas, ou o atleta no próprio
        cadastro (outro atleta: 404). IBVAR: 403. O arquivo vai em base64, é
        conferido pelo tamanho e pela assinatura e fica no Storage privado.
        `categoria`: evidencia (padrão), sumula ou balanca. Use o `id` retornado
        como `anexoId` ao lançar a nota. Cota de 200 MB por atleta (soma dos
        anexos não removidos): acima dela, 413 `cota_excedida`. Limite de 20
        envios por minuto por usuário (429 `limite_excedido`)."
