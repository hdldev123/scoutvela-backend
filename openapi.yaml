                                type: integer
                                minimum: -9007199254740991
                                maximum: 9007199254740991
                            required:
                              - faixaId
                              - nome
                              - n
                            additionalProperties: false
                        aptosNosGates:
                          nullable: true
                          description: Aptos nos 4 gates; nulo sem congelamento completo ou se suprimido
                          type: integer
                          minimum: -9007199254740991
                          maximum: 9007199254740991
                        congelamentoCompleto:
