  /investimento:
    get:
      summary: "Painel de investimento: agregados do piloto e lista 'Onde investir'"
      tags:
        - investimento
      description: "Sem `ciclo`, abre no último ciclo fechado, com os números
        congelados no fechamento (score, faixa, pilares, gates, status final e
        perfil de suporte); sem ciclo fechado, no ciclo aberto, calculado na
        hora (`parcial: true`); sem nenhum ciclo, calculado na hora com
        `cicloExibido: null`. `?ciclo=<id>` escolhe outro ciclo (inexistente:
        404). Ciclo fechado antes do congelamento completo só tem score e faixa:
        o resto vem nulo, `congelamentoCompleto` é false e `ondeInvestir` vem
        vazia. Os números agregados incluem todos os atletas do piloto. A lista
        'Onde investir' do IBVAR traz só quem consentiu (vale o consentimento
        atual), sem meses assegurados. `dadosAtualizadosEm` é sempre agregado,
        nunca de um atleta. O campo `ciclo` fica por compatibilidade e repete
        nome e prazo de `cicloExibido`."
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: query
          name: ciclo
          required: false
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ciclo:
                    nullable: true
                    description: "Compatibilidade: nome e prazo do ciclo exibido (o mesmo de
                      cicloExibido)"
                    type: object
                    properties:
                      nome:
                        type: string
                      prazo:
                        type: string
                        description: AAAA-MM-DD
                    required:
                      - nome
                      - prazo
                    additionalProperties: false
                  cicloExibido:
                    nullable: true
                    description: Ciclo de onde saem os números; nulo se ainda não existe nenhum
                      ciclo
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      nome:
                        type: string
                      inicio:
                        type: string
                        description: AAAA-MM-DD
                      prazo:
                        type: string
                        description: AAAA-MM-DD
                      status:
                        type: string
                        enum:
                          - aberto
                          - fechado
                      fechadoEm:
                        nullable: true
                        description: Instante ISO do fechamento; nulo se aberto
                        type: string
                    required:
                      - id
                      - nome
                      - inicio
                      - prazo
                      - status
                      - fechadoEm
                    additionalProperties: false
                  parcial:
                    type: boolean
                    description: "true: números calculados na hora (ciclo aberto ou sem ciclo),
                      ainda podem mudar"
                  congelamentoCompleto:
                    type: boolean
                    description: "false: ciclo fechado antes do congelamento completo; só score e
                      faixa existem e o resto vem nulo"
                  ciclosDisponiveis:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                        nome:
                          type: string
                        status:
                          type: string
                          enum:
                            - aberto
                            - fechado
                        fechadoEm:
                          nullable: true
                          type: string
                      required:
                        - id
                        - nome
                        - status
                        - fechadoEm
                      additionalProperties: false
                    description: Para o seletor, do mais recente ao mais antigo
                  dadosAtualizadosEm:
                    nullable: true
                    description: "Instante ISO. Ciclo fechado: o fechamento. Ciclo aberto: o último
                      lançamento que muda score ou gates no piloto. Sempre
                      agregado, nunca de um atleta"
                    type: string
