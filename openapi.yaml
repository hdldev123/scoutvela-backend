  /atletas/{id}/anonimizar:
    post:
      summary: Anonimiza o atleta a pedido de exclusão (LGPD, art. 18)
      tags:
        - titular
      description: "Só o gestor, com o pedido de exclusão do próprio atleta (aberto) e
        a confirmação `ANONIMIZAR`. Numa transação: tira nome, contato, clube,
        cidade, número de vela, ID World Sailing e código VelaID (vira
        `ANON-xxxxxxxx`), apaga a linha do VelaID, anonimiza a conta de login,
        revoga os consentimentos, marca as evidências como removidas, responde o
        pedido e audita. A série histórica (notas, respostas, medidas, gates,
        financeiro, plano) é mantida, sem identificação direta. Depois do commit
        remove os arquivos do Storage e a conta do Supabase Auth: se algo
        falhar, a anonimização vale e a resposta traz `pendencias`. Repetir a
        chamada com o mesmo pedido só tenta de novo essas pendências. Atleta já
        anonimizado por outro pedido, ou pedido já respondido, devolve 409."
