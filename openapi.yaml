    put:
      summary: "Edita o perfil: nome (treinador e gestor) ou e-mail, telefone e
        validade do passaporte (atleta)"
      tags:
        - sessao
      description: "Nome, gênero e data de nascimento do atleta (informados em PUT
        /me/cadastro) e o ID World Sailing não são editáveis aqui: a correção é
        pelo pedido do titular (tipo `correcao`); só o gestor troca o WS ID.
        `telefone` (atleta): E.164; aceita espaços, parênteses, traços e pontos,
        que são removidos; sem `+` só com DDD brasileiro (10 ou 11 dígitos), e
        então vira `+55...`; outro formato é 400. `passaporteValidoAte`
        (atleta): `AAAA-MM`, gravado como o último dia do mês; data passada é
        aceita (serve para avisar que venceu); não guardamos número nem cópia do
        passaporte. `telefone` e `passaporteValidoAte` aceitam `null` para
        apagar. `bio` (atleta): texto simples de até 500 caracteres (espaços nas
        pontas saem; vazio ou `null` apaga). A auditoria guarda só os nomes dos
        campos (nunca o texto da bio)."
      requestBody:
        required: true
        content:
