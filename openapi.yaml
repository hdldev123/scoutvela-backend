  /autoavaliacoes:
    post:
      summary: O atleta sugere a nota de seus indicadores (autoavaliação)
      tags:
        - autoavaliacao
      description: "Só o atleta, no próprio cadastro, com ciclo aberto (sem ciclo
        aberto: 409). Só indicadores com `autoavaliacao: true` em GET
        /parametros (outro: 400 em `notas.N.indicadorId`). A evidência segue a
        regra do indicador (`evidencia`; obrigatória ausente: 400 em
        `notas.N.evidencia`); `link` só https://; `anexoId` só de anexo do
        próprio atleta (400 em `notas.N.anexoId`). Grava em `avaliacoes` com
        origem `autoavaliacao`, sem avaliador. Pode reenviar: a sugestão mais
        recente do ciclo vale (a série só recebe inserções). A sugestão NUNCA
        entra no score, nos gates, no ranking nem no investimento: só a nota do
        treinador conta. Avisa o treinador (`atleta_autoavaliou`, `referencia: {
        quantidade }`). Auditoria `enviar_autoavaliacao` só com ids de indicador
        e contagens."
