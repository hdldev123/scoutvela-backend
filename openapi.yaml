      tags:
        - conversas
      description: "Gestor, treinador e atleta; IBVAR: 403. Atleta: a conversa com o
        treinador atual, as de treinadores antigos (somente leitura) e a com a
        gestão. Treinador: as com os próprios atletas, as de pares antigos
        (somente leitura) e a com a gestão. Gestor: as caixas compartilhadas
