openapi: 3.0.3
info:
  title: Scout Vela API
  version: 0.1.0
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas: {}
paths:
  /health:
    get:
      summary: Verificação de saúde (sem autenticação, não toca dados)
      tags:
        - sessao
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                required:
                  - ok
                additionalProperties: false
  /me:
    get:
      summary: "Quem sou eu: papel, telas liberadas e atleta vinculado"
      tags:
        - sessao
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  usuario:
                    type: object
                    properties:
                      id:
                        type: string
                      nome:
                        type: string
                      email:
                        type: string
                      papel:
                        type: string
                        enum:
                          - gestor
                          - treinador
                          - atleta
                          - ibvar
                          - responsavel
                    required:
                      - id
                      - nome
                      - email
                      - papel
                    additionalProperties: false
                  atleta:
                    nullable: true
                    type: object
                    properties:
                      id:
                        type: string
                      nome:
                        type: string
                    required:
                      - id
                      - nome
                    additionalProperties: false
                  telas:
                    type: array
                    items:
                      type: string
                  telaInicial:
                    type: string
                required:
                  - usuario
                  - atleta
                  - telas
                  - telaInicial
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  erro:
                    type: string
                    enum:
                      - nao_autenticado
                      - sem_acesso
                      - nao_encontrado
                      - requisicao_invalida
                      - erro_interno
                      - limite_excedido
                  mensagem:
                    type: string
                required:
                  - erro
                  - mensagem
                additionalProperties: false
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  erro:
                    type: string
                    enum:
                      - nao_autenticado
                      - sem_acesso
                      - nao_encontrado
                      - requisicao_invalida
                      - erro_interno
                      - limite_excedido
                  mensagem:
                    type: string
                required:
                  - erro
                  - mensagem
                additionalProperties: false
