                              - nomeCurto
                              - media
                            additionalProperties: false
                        funil:
                          nullable: true
                          description: Atletas por faixa de score; nulo se suprimido
                          type: array
                          items:
                            type: object
                            properties:
                              faixaId:
                                type: string
                              nome:
                                type: string
