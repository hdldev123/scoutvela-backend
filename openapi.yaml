          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Identificador do resultado (PUT /resultados/:id/validacao)
                  data:
                    type: string
                    description: AAAA-MM-DD
                  nivel:
                    type: string
                  evento:
                    type: string
                  edicao:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                    description: Ano da edição (nos resultados lançados antes da D10, o ano da data)
                  posicao:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  tamanhoFrota:
                    nullable: true
                    description: Nulo quando o atleta informou o resultado sem a frota; a nota não
                      depende dela
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  internacional:
                    type: boolean
                  pontosCbvela:
                    nullable: true
                    description: "Só informação: não entra na nota"
                    type: number
                  fonte:
                    type: string
                    enum:
                      - ranking_cbvela
                      - manual
                      - atleta
                      - world_sailing
                    description: "ranking_cbvela: importado; manual: lançado por gestor ou
                      treinador; atleta: informado pelo atleta; world_sailing:
                      importado do perfil da World Sailing (fonte oficial: vale
                      direto, e o treinador do atleta ou o gestor pode invalidar
                      com motivo)"
