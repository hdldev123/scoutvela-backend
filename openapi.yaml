  /atletas/{id}:
    get:
      summary: Ficha do atleta, conforme a matriz de acesso do papel
      tags:
        - atletas
      description: "`dadosAtualizadosEm` é o último lançamento do próprio atleta; o
        IBVAR só chega à ficha de quem consentiu. Atleta fora do acesso do
        usuário e atleta inexistente dão o mesmo 404; atleta com cadastro
        incompleto também dá 404 (o próprio atleta lê a sugestão em GET /me).
        IBVAR: só vê quem consentiu E está dentro do piloto (mesma regra do
        ranking: aceite do termo, que segue TERMO_EXIGE_REACEITE); fora do
        piloto dá 404, também no histórico do indicador. Gestor, treinador e o
        próprio atleta mantêm o acesso. IBVAR: sem indicadores sensíveis, Class
        Fit, contato, financeiro detalhado nem texto de evidência; o motivo do
        gate G1 vem genérico, sem a diferença em kg."
