        histórico de score da ficha e o painel de investimento (GET
        /investimento?ciclo=). Depois do commit, avisa por e-mail as contas
        ativas de gestor e IBVAR (sem score nem nome de atleta); falha no envio
        não desfaz o fechamento nem muda a resposta. Se nenhum atleta tiver o
        termo aceito mas houver atletas ativos, recusa com 409 (nada a
        congelar).
