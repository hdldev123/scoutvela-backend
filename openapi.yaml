  /investimento/evolucao:
    get:
      summary: Evolução da turma entre ciclos fechados e meta de alta da média
      tags:
        - investimento
      description: "Para cada ciclo fechado (mais antigo primeiro): atletas, média do
        score, média por pilar, funil por faixa e aptos nos gates, a partir do
        que o fechamento congelou. Ciclo fechado antes do congelamento completo
        só tem score e faixa: pilares e gates vêm nulos. `meta` compara os dois
        últimos ciclos fechados com META_EVOLUCAO (nula sem dois ciclos).
        `?classeId=` recorta pela classe atual dos atletas (inexistente: 404).
        Sigilo (D12): para o IBVAR, ciclo com menos de MIN_GRUPO_AGREGADO
        atletas no recorte vem com `suprimido: true` e os números nulos (a meta
        fica nula se um dos dois ciclos foi suprimido); o gestor vê tudo. Só
        agregados: nenhum dado individual. GET /investimento não tem recorte
        (soma todo o piloto), por isso não aplica o mínimo."
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 40
          in: query
          name: classeId
          required: false
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ciclos:
                    type: array
