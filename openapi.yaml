      description: "Gestor, treinador dos próprios atletas e o próprio atleta (IBVAR:
        403; outro atleta ou treinador: 404). Do mais recente para o mais
        antigo. `?status=validado|pendente|recusado` filtra pela situação (os
        lançados por gestor, treinador ou importados do Ranking CBVela são
        sempre `validado`; os da World Sailing (`fonte: world_sailing`) são
        `validado` até serem invalidados, e então `recusado`, com o motivo).
        Cada item traz fonte, edição, súmula (`anexo`), motivo da recusa ou da
        invalidação e quem validou."
