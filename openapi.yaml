  /atletas/{id}/autoavaliacao:
    get:
      summary: "Atleta × treinador: a sugestão do atleta e a nota do treinador por
        indicador"
      tags:
        - autoavaliacao
      description: "Gestor, treinador dos próprios atletas e o próprio atleta (IBVAR:
        403; outro atleta ou treinador: 404). `?ciclo=<id>`; sem ele, o ciclo
        aberto ou, não havendo, o último fechado. Traz os indicadores com
        autoavaliação ligada e os que já têm sugestão no ciclo. `diferenca` =
        nota do treinador − nota do atleta. `resumoPorPilar` (diferença média
        por pilar) só vem para o gestor. Cada indicador traz `evidencia`
        (obrigatoria|opcional) e `orientacao`, e a resposta traz `rubricas`
        (escala geral com `pilarId` nulo e a de cada pilar com rubrica própria)
        e `orientacoesResultados` (orientação dos indicadores de resultado, de
        nota calculada), porque o atleta não lê GET /parametros."
