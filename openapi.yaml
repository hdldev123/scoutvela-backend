    get:
      summary: Mensagens de uma conversa, em ordem cronológica
      tags:
        - conversas
      description: "Só as partes da conversa; o gestor lê uma `treinador_atleta` só
        com supervisão vigente (POST /conversas/{id}/acesso-supervisao); sem
        acesso, 404 (não revela que a conversa existe). Sem filtros: as `limite`
        mais recentes. `antesDe` (instante ISO): as mensagens anteriores a ele,
        para rolar o histórico (`proximoAntesDe` da resposta anterior).
        `depoisDe` (instante ISO): só as mais novas, para consulta a cada 15 a
        30 segundos. `propria` é verdadeiro nas mensagens de quem chama. O texto
        é puro: o front escapa."
      parameters:
        - schema:
            type: string
            format: date-time
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
          in: query
          name: depoisDe
          required: false
        - schema:
            type: string
