  /atletas:
    post:
      summary: Cadastra o atleta pelo ID World Sailing e registra o envio do termo
      tags:
        - cadastro
      description: "O atleta nasce com cadastro incompleto (sem nome, gênero e data de
        nascimento): ele os informa no primeiro acesso, em PUT /me/cadastro. Até
        lá fica fora do ranking, do score, das pendências, do fechamento de
        ciclo e do investimento. wsId duplicado ou velaid já usado dão 409.
        confirmaMaioridade deve ser true. Se o velaid vier e existir no VelaID,
        o vínculo é guardado e os dados de lá ficam como sugestão para o atleta;
        velaid de menor de 18 anos é recusado. Código fora do VelaID importado é
        aceito, sem sugestão. Revalida classe ativa e treinador válido. Depois
        de gravar o cadastro, busca o perfil na World Sailing pelo WS ID (D19;
        até 15 s) e importa os resultados de regata (valem direto, com `fonte:
        world_sailing`), o histórico de ranking e a sugestão de nome, gênero,
        nascimento, foto e bio para o atleta; o resumo vem em `worldSailing`. O
        cadastro NUNCA falha por causa da World Sailing: ID não encontrado,
        falha ou tempo esgotado voltam em `worldSailing.status` e o gestor pode
        tentar de novo em POST /atletas/:id/world-sailing."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                wsId:
                  type: string
                  maxLength: 40
                  description: "ID World Sailing (ex.: BRARB51). Vira maiúsculas e sem espaços;
                    formato ^[A-Z]{3}[A-Z0-9]{2,12}$"
                email:
                  type: string
                  maxLength: 254
                  format: email
                  pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                  description: "E-mail do atleta: conta de login, convite e termo"
                classeId:
                  type: string
                  minLength: 1
                  maxLength: 40
                treinadorId:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                velaid:
                  description: Código VelaID, opcional. Se existir em velaid_registros, os dados
                    de lá viram sugestão para o atleta confirmar no primeiro
                    acesso
                  type: string
                  maxLength: 40
                confirmaMaioridade:
                  type: boolean
                  enum:
                    - true
                criarConta:
                  default: true
                  description: Cria a conta do atleta (papel atleta) e envia o convite
                  type: boolean
              required:
                - wsId
                - email
                - classeId
                - treinadorId
                - confirmaMaioridade
      security: *a7
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  wsId:
                    type: string
                  velaid:
                    nullable: true
                    type: string
                  cadastroCompleto:
                    type: boolean
                    enum:
                      - false
                  termo:
                    type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - aguardando_aceite
                      versao:
                        type: string
                    required:
                      - status
                      - versao
                    additionalProperties: false
                  conta:
                    type: string
                    enum:
                      - convite_enviado
                      - sem_email
                      - indisponivel
                    description: "convite_enviado: conta criada e convite enviado. sem_email:
                      nenhuma conta criada (e-mail já em uso ou
                      criarConta=false). indisponivel: conta criada, mas o
                      convite não foi enviado (use POST /usuarios/:id/convite)."
                  worldSailing:
                    type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - ok
                          - nao_encontrado
                          - falhou
                          - desligado
                        description: "ok: buscou (veja as contagens). nao_encontrado: o ID não existe na
                          World Sailing. falhou: a World Sailing não respondeu
                          direito (nada foi importado; tente de novo depois).
                          desligado: a integração está desligada neste ambiente"
                      resultadosNovos:
                        type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                        description: Resultados de regata novos nesta busca
                      rankingNovos:
                        type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                        description: Posições de ranking novas nesta busca
                    required:
                      - status
                      - resultadosNovos
                      - rankingNovos
                    additionalProperties: false
                    description: Resumo da busca na World Sailing feita logo depois do cadastro
                required:
                  - id
                  - wsId
                  - velaid
                  - cadastroCompleto
                  - termo
                  - conta
                  - worldSailing
                additionalProperties: false
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  erro:
                    type: string
                    enum:
                      - nao_autenticado
