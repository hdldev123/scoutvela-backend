                telefone:
                  description: E.164, ou só com DDD brasileiro (vira +55...); null apaga
                  nullable: true
                  type: string
                  maxLength: 40
                passaporteValidoAte:
                  description: AAAA-MM; null apaga
                  nullable: true
                  type: string
                  maxLength: 7
                bio:
                  description: "Mini bio do atleta (texto simples, até 500 caracteres; vazio ou
                    null apaga). Texto livre visto pelo gestor, pelo treinador
                    e, com o aceite do termo que inclui foto e bio, pelo IBVAR:
                    não cite saúde, família nem contato"
                  nullable: true
                  type: string
                  maxLength: 500
              additionalProperties: false
