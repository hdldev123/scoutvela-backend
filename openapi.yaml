    put:
      summary: Atualiza pesos, faixas de score, rubricas, regras, evidência por
        indicador e classes
      tags:
        - parametros
      description: O ranking recalcula sozinho (o cálculo é feito na leitura). Grava
        auditoria com antes e depois.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pesos:
                  description: Peso de cada um dos 9 pilares; a soma precisa ser 100
                  type: object
                  additionalProperties:
                    type: integer
                    minimum: 0
                    maximum: 100
                faixas:
                  description: As 4 faixas; scoreMin estritamente decrescente na ordem das faixas
                    e a última com 0
                  maxItems: 10
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        minLength: 1
                        maxLength: 40
                      scoreMin:
                        type: number
                        minimum: 0
                        maximum: 100
                    required:
                      - id
                      - scoreMin
                rubricas:
                  description: Upsert por (pilarId, nota)
                  maxItems: 100
                  type: array
                  items:
                    type: object
                    properties:
                      pilarId:
                        nullable: true
                        description: Nulo = escala geral de 0 a 5
                        type: string
                        minLength: 1
                        maxLength: 40
                      nota:
                        type: integer
                        minimum: 0
                        maximum: 5
                      descricao:
                        type: string
                        minLength: 3
                        maxLength: 300
                    required:
                      - pilarId
                      - nota
                      - descricao
                rubricasRemover:
                  description: "Ids de pilar cujas rubricas próprias saem (volta a valer a escala
                    geral). A escala geral não pode ser removida: nulo ou vazio
                    dão 400 com mensagem explícita"
                  minItems: 1
                  maxItems: 20
                  type: array
                  items:
                    nullable: true
                    type: string
                    maxLength: 40
                regras:
                  description: '{codigo: valor}; códigos aceitos: P3, G1, G2, G3, G4,
                    RANKING_CBVELA, TERMO_EXIGE_REACEITE, PERF_RESULTADOS,
                    META_EVOLUCAO, MIN_GRUPO_AGREGADO, TENDENCIA, WS_NIVEIS.
                    WS_NIVEIS (regra provisória P13, D19): { niveis: { "<nome do
                    nível na World Sailing>": "<nível no Scout Vela>" } }, até
                    100 entradas, nome de 1 a 120 caracteres e destino mundial,
                    sul_americano, continental, internacional_aberto,
                    brasileiro, estadual ou regional; evento sem nível na World
                    Sailing, ou com nível fora da regra, vira
                    internacional_aberto (registrado, sem nota). Vale nas
                    próximas importações (os resultados já importados não
                    mudam). TENDENCIA (D13): { limiar (maior que 0, até 100) },
                    pontos de score da tendência do atleta e da faixa de na
                    média da turma. META_EVOLUCAO (D12): { percentual (0 a 1000)
                    }, meta de alta da média do score da turma sobre o ciclo
                    fechado anterior. MIN_GRUPO_AGREGADO (D12): { minimo
                    (inteiro, 1 a 1000) }, menor grupo que o IBVAR vê em
                    agregado. O valor segue o formato lido em GET /parametros.
                    PERF_RESULTADOS (regra provisória P12): { edicoes_max (1 a
                    20), sem_resultado (nota 0 a 5 do nível sem resultado
                    validado, padrão 0), niveis: { mundial, continental,
                    nacional } }, cada nível uma lista de faixas { ate, nota }
                    em ordem: ate crescente (inteiro, 1 a 500), só a última com
                    ate nulo (qualquer colocação), nota inteira de 0 a 5 que não
                    aumenta'
                  type: object
                  additionalProperties: {}
                indicadores:
                  description: "Regra por indicador: `evidencia` (obrigatoria ou opcional),
                    `autoavaliacao` (boolean) e/ou `orientacao` (texto de ajuda,
                    até 1.000 caracteres; null remove). A auditoria guarda antes
                    e depois (da orientação, só se havia texto)"
                  minItems: 1
                  maxItems: 100
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        minLength: 1
                        maxLength: 64
                      evidencia:
                        type: string
                        enum:
                          - obrigatoria
                          - opcional
                      autoavaliacao:
                        description: Liga ou desliga a autoavaliação do indicador (só tipo T não
                          calculado pode ligar)
                        type: boolean
                      orientacao:
                        description: Texto de ajuda do indicador (até 1.000 caracteres); null remove
                        nullable: true
                        type: string
                        minLength: 1
                        maxLength: 1000
                    required:
                      - id
                    additionalProperties: false
                classes:
                  maxItems: 50
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        minLength: 1
                        maxLength: 40
                      pesoMinKg:
                        type: number
                        minimum: 0
                        maximum: 400
                      pesoMedioKg:
                        type: number
                        minimum: 0
                        maximum: 400
                      pesoMaxKg:
                        type: number
                        minimum: 0
                        maximum: 400
                      alturaMinCm:
                        description: Altura de referência da classe, só informativa (não entra no score
                          nem nos gates). Informe as três (min, média, max; 120
                          a 230 cm, min <= média <= max) ou as três nulas para
                          limpar
                        nullable: true
                        type: number
                        minimum: 120
                        maximum: 230
                      alturaMediaCm:
                        nullable: true
                        type: number
                        minimum: 120
                        maximum: 230
                      alturaMaxCm:
                        nullable: true
                        type: number
                        minimum: 120
                        maximum: 230
                      ativa:
                        description: Não dá para desativar classe com atleta ativo
                        type: boolean
                      fonte:
                        description: Fonte da faixa de peso (documento, versão e data), só informativa.
                          Nulo limpa. A auditoria guarda antes e depois
                        nullable: true
                        type: object
                        properties:
                          documento:
                            type: string
                            minLength: 1
                            maxLength: 200
                          versao:
                            nullable: true
                            type: string
                            minLength: 1
                            maxLength: 40
                          data:
                            nullable: true
                            type: string
                            format: date
                            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
                        required:
                          - documento
                    required:
                      - id
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  pilares:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
