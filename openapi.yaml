openapi: 3.0.3
info:
  title: Scout Vela API
  version: 0.2.1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas: {}
paths:
  /health:
    get:
      summary: Verificação de saúde (sem autenticação, não toca dados)
      tags:
        - sessao
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                required:
                  - ok
                additionalProperties: false
  /me:
    get:
      summary: "Quem sou eu: papel, telas liberadas e atleta vinculado"
      tags:
        - sessao
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  usuario:
                    type: object
                    properties:
                      id:
                        type: string
                      nome:
                        type: string
                      email:
                        type: string
                      papel:
                        type: string
                        enum:
                          - gestor
                          - treinador
                          - atleta
                          - ibvar
                          - responsavel
                      fotoUrl:
                        nullable: true
                        description: Link assinado curto; nulo = sem foto
                        type: string
                    required:
                      - id
                      - nome
                      - email
                      - papel
                      - fotoUrl
                    additionalProperties: false
                  atleta:
                    nullable: true
                    type: object
                    properties:
                      id:
                        type: string
                      nome:
                        nullable: true
                        description: Nulo até o atleta completar o cadastro
                        type: string
                    required:
                      - id
                      - nome
                    additionalProperties: false
                  cadastroPendente:
                    nullable: true
                    description: "Só para o atleta que ainda não completou o cadastro: ele informa
                      nome, gênero e data de nascimento em PUT /me/cadastro
                      antes do painel. Nulo nos demais casos."
                    type: object
                    properties:
                      wsId:
                        type: string
                      velaid:
                        nullable: true
                        type: string
                      sugestao:
                        nullable: true
                        description: Dados do VelaID ou, sem eles, do perfil da World Sailing, para o
                          atleta confirmar ou corrigir; nula sem nenhum dos dois
                        type: object
                        properties:
                          nome:
                            type: string
                          genero:
                            nullable: true
                            description: Nulo se a World Sailing não informa
                            type: string
                            enum:
                              - F
                              - M
                          dataNascimento:
                            nullable: true
                            description: AAAA-MM-DD; nula se a World Sailing não informa
                            type: string
                        required:
                          - nome
                          - genero
                          - dataNascimento
                        additionalProperties: false
                      origemSugestao:
                        nullable: true
                        description: De onde veio a sugestão (o VelaID vale antes da World Sailing);
                          nula sem sugestão
                        type: string
                        enum:
                          - velaid
                          - world_sailing
                    required:
                      - wsId
                      - velaid
                      - sugestao
                      - origemSugestao
                    additionalProperties: false
                  telas:
                    type: array
                    items:
                      type: string
                  telaInicial:
                    type: string
                required:
                  - usuario
                  - atleta
                  - cadastroPendente
                  - telas
                  - telaInicial
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  erro:
                    type: string
                    enum:
                      - nao_autenticado
                      - sem_acesso
                      - nao_encontrado
                      - requisicao_invalida
                      - erro_interno
                      - limite_excedido
                      - mfa_obrigatorio
                      - servico_indisponivel
                      - evidencia_removida
                      - cota_excedida
                  mensagem:
                    type: string
                  campos:
                    type: array
                    items:
                      type: object
                      properties:
                        campo:
                          type: string
                        mensagem:
                          type: string
                      required:
                        - campo
                        - mensagem
                      additionalProperties: false
                required:
                  - erro
                  - mensagem
                additionalProperties: false
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  erro:
                    type: string
                    enum:
                      - nao_autenticado
                      - sem_acesso
                      - nao_encontrado
                      - requisicao_invalida
                      - erro_interno
                      - limite_excedido
                      - mfa_obrigatorio
                      - servico_indisponivel
                      - evidencia_removida
                      - cota_excedida
                  mensagem:
                    type: string
                  campos:
                    type: array
                    items:
                      type: object
                      properties:
                        campo:
                          type: string
                        mensagem:
                          type: string
                      required:
                        - campo
                        - mensagem
                      additionalProperties: false
                required:
                  - erro
                  - mensagem
                additionalProperties: false
  /me/cadastro:
    put:
      summary: "O atleta completa o cadastro: nome, gênero e data de nascimento (uma
        vez)"
      tags:
        - sessao
      description: "Só o atleta, e só uma vez: depois de completo, a segunda chamada
        devolve 409 (a correção é pelo pedido do titular). Os dados sugeridos do
        VelaID vêm em GET /me (cadastroPendente.sugestao). Menor de 18 anos: a
        API recusa com 400 sem gravar a data, o nome nem o gênero, inativa o
        atleta e a conta, abre um pedido de exclusão para o gestor anonimizar e
        soma no balão `cadastro` do gestor; a auditoria não guarda a data. Data
        futura ou de mais de 100 anos: 400. Ao completar, o atleta passa a
        entrar no ranking depois do aceite do termo."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                  minLength: 2
                  maxLength: 120
                genero:
                  type: string
                  enum:
                    - F
                    - M
                dataNascimento:
                  type: string
                  format: date
                  pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
                  description: AAAA-MM-DD
              required:
                - nome
                - genero
                - dataNascimento
              additionalProperties: false
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  nome:
                    type: string
                  genero:
                    type: string
                    enum:
                      - F
                      - M
                  dataNascimento:
                    type: string
                  cadastroCompleto:
                    type: boolean
                    enum:
                      - true
                required:
                  - nome
                  - genero
                  - dataNascimento
                  - cadastroCompleto
                additionalProperties: false
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  erro:
                    type: string
                    enum:
                      - nao_autenticado
                      - sem_acesso
                      - nao_encontrado
                      - requisicao_invalida
                      - erro_interno
                      - limite_excedido
                      - mfa_obrigatorio
                      - servico_indisponivel
                      - evidencia_removida
                      - cota_excedida
                  mensagem:
                    type: string
                  campos:
                    type: array
                    items:
                      type: object
                      properties:
                        campo:
                          type: string
                        mensagem:
                          type: string
                      required:
                        - campo
                        - mensagem
                      additionalProperties: false
                required:
                  - erro
                  - mensagem
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  erro:
                    type: string
                    enum:
                      - nao_autenticado
                      - sem_acesso
                      - nao_encontrado
                      - requisicao_invalida
                      - erro_interno
                      - limite_excedido
                      - mfa_obrigatorio
                      - servico_indisponivel
                      - evidencia_removida
                      - cota_excedida
                  mensagem:
                    type: string
                  campos:
                    type: array
                    items:
                      type: object
                      properties:
                        campo:
                          type: string
                        mensagem:
                          type: string
                      required:
                        - campo
                        - mensagem
                      additionalProperties: false
                required:
                  - erro
                  - mensagem
                additionalProperties: false
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  erro:
                    type: string
                    enum:
                      - nao_autenticado
                      - sem_acesso
                      - nao_encontrado
                      - requisicao_invalida
                      - erro_interno
                      - limite_excedido
                      - mfa_obrigatorio
                      - servico_indisponivel
                      - evidencia_removida
                      - cota_excedida
                  mensagem:
                    type: string
                  campos:
                    type: array
                    items:
                      type: object
                      properties:
                        campo:
                          type: string
                        mensagem:
                          type: string
                      required:
                        - campo
                        - mensagem
                      additionalProperties: false
                required:
                  - erro
                  - mensagem
                additionalProperties: false
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  erro:
                    type: string
                    enum:
                      - nao_autenticado
                      - sem_acesso
                      - nao_encontrado
                      - requisicao_invalida
                      - erro_interno
                      - limite_excedido
                      - mfa_obrigatorio
                      - servico_indisponivel
                      - evidencia_removida
                      - cota_excedida
                  mensagem:
                    type: string
                  campos:
                    type: array
                    items:
                      type: object
                      properties:
                        campo:
                          type: string
                        mensagem:
                          type: string
                      required:
                        - campo
                        - mensagem
                      additionalProperties: false
                required:
                  - erro
                  - mensagem
                additionalProperties: false
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  erro:
                    type: string
                    enum:
                      - nao_autenticado
                      - sem_acesso
                      - nao_encontrado
                      - requisicao_invalida
                      - erro_interno
                      - limite_excedido
                      - mfa_obrigatorio
                      - servico_indisponivel
                      - evidencia_removida
                      - cota_excedida
                  mensagem:
                    type: string
                  campos:
                    type: array
                    items:
                      type: object
                      properties:
                        campo:
                          type: string
                        mensagem:
                          type: string
                      required:
                        - campo
                        - mensagem
                      additionalProperties: false
                required:
                  - erro
                  - mensagem
                additionalProperties: false
  /me/notificacoes:
    get:
      summary: Contagens dos balões do menu lateral (itens que pedem atenção)
      tags:
        - sessao
      description: "Só as chaves do papel, sempre presentes (0 quando nada pede
        atenção). Gestor: `revisoes` (pedidos de revisão e do titular abertos),
        `cadastro` (atletas ativos sem aceite da versão vigente do termo),
        `investimento`, `sugestoes` (sugestões dos treinadores ainda abertas),
        `avisos` (avisos não lidos, D8, sem os de mensagem nova, que já contam
        em `conversas`) e `conversas` (mensagens não lidas das caixas
        compartilhadas da gestão, D16). Treinador: `revisoes` (pedidos de
        revisão abertos dos próprios atletas), `avaliar` (próprios atletas com
        indicadores pendentes no ciclo aberto; 0 sem ciclo aberto), `avisos` e
        `conversas` (mensagens não lidas, D16). Atleta: `avisos`, `conversas`
        (mensagens não lidas) e `painel` (perguntas ainda sem resposta, hoje
        contadas só com ciclo aberto, + 1 se o termo vigente está pendente +
        respostas a pedidos de revisão e do titular dadas depois da última
        marcação de visto). IBVAR: só `investimento`. `investimento` (gestor e
        IBVAR) vale 1 quando há ciclo fechado depois da última vez que a pessoa
        marcou a tela como vista (PUT /me/notificacoes/vistas com chave
        `investimento`), senão 0. `total` é a soma. Feito para consulta a cada
        60 s."
      security: &a1
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  contagens:
                    type: object
                    additionalProperties:
                      type: integer
                      minimum: 0
                      maximum: 9007199254740991
                  total:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                required:
                  - contagens
                  - total
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  erro:
                    type: string
                    enum:
                      - nao_autenticado
                      - sem_acesso
                      - nao_encontrado
                      - requisicao_invalida
                      - erro_interno
                      - limite_excedido
                      - mfa_obrigatorio
                      - servico_indisponivel
                      - evidencia_removida
                      - cota_excedida
                  mensagem:
                    type: string
                  campos:
                    type: array
                    items:
                      type: object
                      properties:
                        campo:
                          type: string
                        mensagem:
                          type: string
                      required:
                        - campo
                        - mensagem
                      additionalProperties: false
                required:
                  - erro
                  - mensagem
                additionalProperties: false
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  erro:
                    type: string
                    enum:
                      - nao_autenticado
                      - sem_acesso
                      - nao_encontrado
                      - requisicao_invalida
                      - erro_interno
                      - limite_excedido
                      - mfa_obrigatorio
                      - servico_indisponivel
                      - evidencia_removida
                      - cota_excedida
                  mensagem:
                    type: string
                  campos:
                    type: array
                    items:
                      type: object
                      properties:
                        campo:
                          type: string
                        mensagem:
                          type: string
                      required:
                        - campo
                        - mensagem
                      additionalProperties: false
                required:
                  - erro
                  - mensagem
                additionalProperties: false
  /me/notificacoes/vistas:
    put:
      summary: Marca uma tela como vista (zera as respostas novas do balão)
      tags:
        - sessao
      description: "Grava o instante atual como última visita à tela. O atleta marca
        `painel`; gestor e IBVAR marcam `investimento` (zera o aviso de ciclo
        fechado); qualquer outra combinação de papel e chave responde 400. Não
        gera auditoria: é dado de interface, não de decisão."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                chave:
                  type: string
                  enum:
                    - painel
                    - revisoes
                    - cadastro
                    - avaliar
                    - investimento
              required:
                - chave
      security: *a1
      responses:
        "204":
          description: Default Response
          content:
            application/json:
              schema:
                type: string
                nullable: true
                enum:
                  - null
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  erro:
                    type: string
                    enum:
                      - nao_autenticado
                      - sem_acesso
                      - nao_encontrado
                      - requisicao_invalida
                      - erro_interno
                      - limite_excedido
                      - mfa_obrigatorio
                      - servico_indisponivel
                      - evidencia_removida
                      - cota_excedida
                  mensagem:
                    type: string
                  campos:
                    type: array
                    items:
                      type: object
                      properties:
                        campo:
                          type: string
                        mensagem:
                          type: string
                      required:
                        - campo
                        - mensagem
                      additionalProperties: false
                required:
                  - erro
                  - mensagem
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  erro:
                    type: string
                    enum:
                      - nao_autenticado
                      - sem_acesso
                      - nao_encontrado
                      - requisicao_invalida
                      - erro_interno
                      - limite_excedido
                      - mfa_obrigatorio
                      - servico_indisponivel
                      - evidencia_removida
                      - cota_excedida
                  mensagem:
                    type: string
                  campos:
                    type: array
                    items:
                      type: object
                      properties:
                        campo:
                          type: string
                        mensagem:
                          type: string
                      required:
                        - campo
                        - mensagem
                      additionalProperties: false
                required:
                  - erro
                  - mensagem
                additionalProperties: false
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  erro:
                    type: string
                    enum:
                      - nao_autenticado
                      - sem_acesso
                      - nao_encontrado
                      - requisicao_invalida
                      - erro_interno
                      - limite_excedido
                      - mfa_obrigatorio
                      - servico_indisponivel
                      - evidencia_removida
                      - cota_excedida
                  mensagem:
                    type: string
                  campos:
                    type: array
                    items:
                      type: object
                      properties:
                        campo:
                          type: string
                        mensagem:
                          type: string
                      required:
                        - campo
                        - mensagem
                      additionalProperties: false
                required:
                  - erro
                  - mensagem
                additionalProperties: false
  /me/perfil:
    get:
      summary: "Meu perfil: dados de contato, foto e, para o atleta, o cadastro"
      tags:
        - sessao
      description: Atleta, treinador e gestor. IBVAR recebe 403.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  nome:
                    type: string
                  email:
                    type: string
                    description: E-mail de login (só leitura)
                  papel:
                    type: string
                    enum:
                      - gestor
                      - treinador
                      - atleta
                  fotoUrl:
                    nullable: true
                    description: Link assinado curto; nulo = sem foto
                    type: string
                  mfaAtivo:
                    type: boolean
                    description: A sessão atual passou pelo segundo fator (aal2)
                  atleta:
                    nullable: true
                    type: object
                    properties:
                      wsId:
                        type: string
                        description: ID World Sailing (a chave do atleta)
                      velaid:
                        nullable: true
                        description: Nulo se o atleta não tem VelaID
                        type: string
                      cadastroCompleto:
                        type: boolean
                        description: Falso até o atleta informar nome, gênero e data de nascimento (PUT
                          /me/cadastro)
                      classe:
                        type: object
                        properties:
                          id:
                            type: string
                          nome:
                            type: string
                        required:
                          - id
                          - nome
                        additionalProperties: false
                      numeroVela:
                        nullable: true
                        type: string
                      dataNascimento:
                        nullable: true
                        description: AAAA-MM-DD; nula com o cadastro incompleto
                        type: string
                      clube:
                        nullable: true
                        type: string
                      cidade:
                        nullable: true
                        type: string
                      uf:
                        nullable: true
                        type: string
                      treinador:
                        nullable: true
                        type: object
                        properties:
                          id:
                            type: string
                          nome:
                            type: string
                        required:
                          - id
                          - nome
                        additionalProperties: false
                      emailContato:
                        nullable: true
                        type: string
                      termoAceitoEm:
                        nullable: true
                        description: Instante ISO do aceite do termo do piloto
                        type: string
                      compartilharIbvar:
                        type: boolean
                      telefone:
                        nullable: true
                        description: E.164 (+5511999998888); nulo se não informado
                        type: string
                      passaporteValidoAte:
                        nullable: true
                        description: AAAA-MM (último dia do mês); sem número nem cópia do passaporte
                        type: string
                      aptidao:
                        nullable: true
                        description: Última aptidão conferida pelo gestor; nulo se nunca conferida
                        type: object
                        properties:
                          apto:
                            type: boolean
                          conferidoEm:
                            type: string
                            description: Instante ISO em que o gestor conferiu
                          conferidoPor:
                            type: object
                            properties:
                              nome:
                                type: string
                            required:
                              - nome
                            additionalProperties: false
                        required:
                          - apto
                          - conferidoEm
                          - conferidoPor
                        additionalProperties: false
                      bio:
                        nullable: true
                        description: Mini bio (texto simples, até 500 caracteres); nula se não escreveu
                        type: string
                    required:
                      - wsId
                      - velaid
                      - cadastroCompleto
                      - classe
                      - numeroVela
                      - dataNascimento
                      - clube
                      - cidade
                      - uf
                      - treinador
                      - emailContato
                      - termoAceitoEm
                      - compartilharIbvar
                      - telefone
                      - passaporteValidoAte
                      - aptidao
                      - bio
                    additionalProperties: false
                  treinador:
                    nullable: true
                    type: object
                    properties:
                      quantidadeAtletas:
                        type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                    required:
                      - quantidadeAtletas
                    additionalProperties: false
                  sugestaoWorldSailing:
                    nullable: true
                    description: Sugestão de foto e bio do perfil da World Sailing (D19). Só para o
                      atleta, enquanto ele não decidiu (POST
                      /me/perfil/world-sailing) e houver foto ou bio; nulo nos
                      demais casos
                    type: object
                    properties:
                      fotoUrl:
                        nullable: true
                        description: Foto de https://assets.sailing.org/, para a prévia (o servidor é
                          quem a baixa)
                        type: string
                      bio:
                        nullable: true
                        description: Texto da World Sailing; vai cortado em 500 caracteres
                        type: string
                    required:
                      - fotoUrl
                      - bio
                    additionalProperties: false
                required:
                  - nome
                  - email
                  - papel
                  - fotoUrl
                  - mfaAtivo
                  - atleta
                  - treinador
                  - sugestaoWorldSailing
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  erro:
                    type: string
                    enum:
                      - nao_autenticado
                      - sem_acesso
                      - nao_encontrado
                      - requisicao_invalida
                      - erro_interno
                      - limite_excedido
                      - mfa_obrigatorio
                      - servico_indisponivel
                      - evidencia_removida
                      - cota_excedida
                  mensagem:
                    type: string
                  campos:
                    type: array
                    items:
                      type: object
                      properties:
                        campo:
                          type: string
                        mensagem:
                          type: string
                      required:
                        - campo
                        - mensagem
                      additionalProperties: false
                required:
                  - erro
                  - mensagem
                additionalProperties: false
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  erro:
                    type: string
                    enum:
                      - nao_autenticado
                      - sem_acesso
