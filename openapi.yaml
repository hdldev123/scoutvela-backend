    post:
      summary: Busca de novo o perfil do atleta na World Sailing
      tags:
        - world-sailing
      description: "Gestor, ou treinador dos próprios atletas (outro treinador e
        atleta inexistente: 404; atleta e IBVAR: 403; atleta anonimizado: 409).
        Importa só o que é novo (resultados com `fonte: world_sailing`, que
        valem direto na nota P12 e nos gates, e o histórico de ranking) e renova
        a sugestão de cadastro, foto e bio; repetir a busca não duplica nada. No
        máximo uma busca por atleta a cada 60 segundos (429 `limite_excedido`).
        Com a integração desligada responde `status: desligado`. Atleta não
        encontrado na World Sailing ou falha da World Sailing não são erro da
        API: respondem 200 com `status` `nao_encontrado` ou `falhou`. Auditoria
        `importar_world_sailing` só com o modo, o status e as contagens."
