  /revisoes/{id}/recurso:
    post:
      summary: Atleta discorda da resposta do treinador e pede a 2ª instância (gestor)
      tags:
        - revisoes
      description: Só o atleta dono do pedido (outro pedido dá 404). Só uma vez por
        pedido e só depois da resposta do treinador na 1ª instância; fora disso,
        409 (inclusive pedido respondido pelo gestor, que já é a instância
        final). O pedido volta a `aberto` com `instancia` 2 e só o gestor
        responde. A auditoria guarda a instância, sem o texto.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                texto:
                  type: string
                  minLength: 1
                  maxLength: 1000
              required:
                - texto
      parameters:
        - schema:
            type: string
            pattern: ^\d{1,18}$
          in: path
          name: id
          required: true
      security: *a8
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  atleta:
                    type: object
                    properties:
                      id:
                        type: string
                      nome:
                        type: string
                    required:
                      - id
                      - nome
                    additionalProperties: false
                  pilar:
                    nullable: true
                    type: object
                    properties:
                      id:
                        type: string
                      nomeCurto:
                        type: string
                    required:
                      - id
                      - nomeCurto
                    additionalProperties: false
                  indicador:
                    nullable: true
                    type: object
                    properties:
                      id:
                        type: string
                      nome:
                        type: string
                    required:
                      - id
                      - nome
                    additionalProperties: false
                  motivo:
                    type: string
                  status:
                    type: string
                    enum:
                      - aberto
                      - respondido
                  criadoEm:
                    type: string
                  resposta:
                    nullable: true
                    description: "Resposta vigente: a da 1ª instância enquanto não há recurso;
                      depois do recurso, a da 2ª (nula até o gestor responder)"
                    type: string
                  respondidoEm:
                    nullable: true
                    type: string
                  instancia:
                    anyOf:
                      - type: number
                        enum:
                          - 1
                      - type: number
                        enum:
                          - 2
                    description: "1: treinador ou gestor responde; 2: recurso do atleta, só o gestor
                      responde"
                  primeiraResposta:
                    nullable: true
                    description: Resposta da 1ª instância (também depois do recurso); nula enquanto
                      não respondida
                    type: object
                    properties:
                      texto:
                        type: string
                      papel:
                        type: string
                        enum:
                          - gestor
                          - treinador
                        description: Papel de quem respondeu
                      respondidoEm:
                        type: string
                    required:
                      - texto
                      - papel
                      - respondidoEm
                    additionalProperties: false
                  recurso:
                    nullable: true
                    description: Recurso do atleta contra a resposta da 1ª instância; nulo se não
                      houve
                    type: object
                    properties:
                      texto:
                        type: string
                      em:
                        type: string
                    required:
                      - texto
                      - em
                    additionalProperties: false
                  respostaFinal:
                    nullable: true
                    description: Resposta do gestor na 2ª instância; nula se não houve recurso ou se
                      ainda aberto
                    type: object
                    properties:
                      texto:
                        type: string
                      papel:
                        type: string
                        enum:
                          - gestor
                          - treinador
                        description: Papel de quem respondeu
                      respondidoEm:
                        type: string
                    required:
                      - texto
                      - papel
                      - respondidoEm
                    additionalProperties: false
                  podeRecurso:
                    type: boolean
                    description: true quando o atleta ainda pode pedir a 2ª instância (respondido
                      pelo treinador, sem recurso)
                  avaliacaoId:
                    nullable: true
                    description: Lançamento ligado à resposta, se houver
                    type: string
                  notaAnterior:
                    nullable: true
                    description: Nota do lançamento anterior ao ligado (mesmo atleta e indicador)
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  notaNova:
                    nullable: true
                    description: Nota do lançamento ligado
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                required:
                  - id
                  - atleta
                  - pilar
                  - indicador
                  - motivo
                  - status
                  - criadoEm
                  - resposta
                  - respondidoEm
                  - instancia
                  - primeiraResposta
                  - recurso
                  - respostaFinal
