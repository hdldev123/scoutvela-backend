  /me/resultados:
    post:
      summary: O atleta informa um resultado (uma edição de um evento), com a súmula
        ou o link oficial
      tags:
        - resultados
      description: "Só o atleta, no próprio cadastro completo. `nivel`: mundial,
        continental (inclui Sul-Americano e Pan-Americano) ou nacional
        (Brasileiro); grava como `mundial`, `continental` ou `brasileiro`. `ano`
        é a edição (de 2000 ao ano atual). Exige a súmula (`anexoId`: anexo do
        próprio atleta com categoria `sumula`, enviado em POST
        /atletas/:id/evidencias) ou o `linkOficial` https (400 nos campos
        `anexoId` e `linkOficial` se faltar os dois). `tamanhoFrota` é opcional
        (a nota não depende dele; com ele, a posição não pode passar da frota).
        `data` é opcional (não futura, dentro do `ano`); sem ela, vale o último
        dia do ano da edição, ou hoje se o ano é o atual. Limite de edições: no
        máximo `edicoes_max` (regra PERF_RESULTADOS) do mesmo evento (mesmo
        nome, sem diferença de maiúsculas e espaços, e mesmo nível): acima
        disso, 409; edição repetida do mesmo evento, 409. Resultado já recusado
        não conta nos dois limites (dá para informar de novo). Nasce `pendente`:
        só entra na nota e nos gates depois da validação do treinador ou do
        gestor (PUT /resultados/:id/validacao). Avisa o treinador
        (`atleta_lancou_resultado`, `referencia: { resultadoId }`). Auditoria
        `informar_resultado` só com ids e nomes de campo."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                evento:
                  type: string
                  minLength: 2
                  maxLength: 120
                nivel:
                  type: string
                  enum:
                    - mundial
                    - continental
                    - nacional
                ano:
                  type: integer
                  minimum: 2000
                  maximum: 9007199254740991
                posicao:
                  type: integer
                  minimum: 1
                  maximum: 1000
                tamanhoFrota:
                  nullable: true
                  type: integer
                  minimum: 1
                  maximum: 1000
                data:
                  nullable: true
                  type: string
                  format: date
                  pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
                anexoId:
                  nullable: true
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                linkOficial:
                  nullable: true
                  type: string
                  maxLength: 500
                  format: uri
              required:
                - evento
                - nivel
                - ano
                - posicao
              additionalProperties: false
      security: &a6
        - bearerAuth: []
      responses:
