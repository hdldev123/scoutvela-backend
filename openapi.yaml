        resultado da World Sailing
      tags:
        - resultados
      description: "Gestor ou treinador do atleta (outro treinador e resultado
        inexistente: 404; atleta e IBVAR: 403). Vale para resultado da fonte
        `atleta` (valida ou recusa) e da fonte `world_sailing` (D19: `recusar`
        invalida o resultado importado, `validar` o revalida); os lançados por
        gestor ou treinador e os do Ranking CBVela já valem (400). `recusar`
        exige `motivo` (até 300 caracteres; 400 em `motivo`). A decisão vira uma
        linha nova na série (nada é sobrescrito): a situação vigente é a da
        validação mais recente, então dá para mudar de `validado` para
        `recusado` e vice-versa; repetir a situação atual dá 409 (o resultado da
        World Sailing já nasce vigente, então só `recusar` vale antes da
        primeira invalidação). Só o `validado` entra na nota (PERF_RESULTADOS) e
        nos gates G2 e G3: o resultado da World Sailing invalidado sai da nota e
        dos gates até ser revalidado. A súmula fica guardada. Avisa o atleta
        (`resultado_validado` ou `resultado_recusado`, `referencia: {
        resultadoId }`). Auditoria `decidir_resultado` sem o motivo."
